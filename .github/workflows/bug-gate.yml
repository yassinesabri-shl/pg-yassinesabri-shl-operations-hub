name: bug-gate
on:
  pull_request:                   # no `paths:` filter — the script decides "nothing to check"
permissions:
  contents: read
jobs:
  bug:
    name: bug-gate                # branch protection names the job, not the file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the bug records changed in this pull request
        env:
          HARNESS_TRUNK: main
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail

          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BASE_SHA" HEAD -- docs/bugs) || {
              echo "::error::could not diff $BASE_SHA..HEAD"; exit 4; }
          else
            echo "::notice::base commit unavailable; checking every bug record in this branch"
            changed=$(git ls-tree -r --name-only HEAD -- docs/bugs)
          fi

          # The record or the review of one key.
          keys=$(printf '%s\n' "$changed" \
                 | sed -nE 's#^docs/bugs/([A-Z][A-Z0-9]{1,9}-[0-9]+)\.(bug|bug-review)\.md$#\1#p' | sort -u)

          [ -z "$keys" ] && { echo "no bug-record changes"; exit 0; }

          candidate="$RUNNER_TEMP/candidate-trunk.git"
          {
            git init --bare --quiet --initial-branch="$HARNESS_TRUNK" "$candidate" &&
            git push --quiet "$candidate" "HEAD:refs/heads/$HARNESS_TRUNK" &&
            git clone --quiet "$candidate" "$RUNNER_TEMP/candidate" &&
            cd "$RUNNER_TEMP/candidate"
          } || { echo "::error::could not build the candidate trunk"; exit 4; }

          worst=0
          for k in $keys; do
            node scripts/check-bug.mjs "$k" || rc=$?
            rc=${rc:-0}
            [ "$rc" -gt "$worst" ] && worst=$rc
            unset rc
          done
          exit "$worst"
